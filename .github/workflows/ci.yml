name: CI - Run E2E Tests

on:
  push:
    branches:
      - "**"

jobs:
  test:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run E2E tests
        env:
          TESTCONTAINER_DOCKER_IMAGES_TAG: ${{ secrets.TESTCONTAINER_DOCKER_IMAGES_TAG }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          HH_APP_ACCESS_TOKEN: ${{ secrets.HH_APP_ACCESS_TOKEN }}
          HH_APP_EMAIL: ${{ secrets.HH_APP_EMAIL }}
        run: ./gradlew test